<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劍</title>
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body>
  <div class="container article-view">
    <!-- 頂部導覽列 -->
    <nav class="nav-card">
      <a href="../index.html" class="back-link">
        <span class="arrow">←</span> 返回首頁目錄
      </a>
      <div class="badge-group">
        <span class="badge-item badge-lavender">這就是江湖</span>
        <span class="badge-item badge-mint">圖鑒</span>
      </div>
    </nav>

    <article>
      <div class="game-card">
        <!-- 標題卡片 -->
        <div class="title-badge-card guide" style="margin-top: 0;">
          <h2>圖鑑 ● 劍</h2>
          <div class="badge-group">
            <span class="badge-item badge-orange">招式</span>
          </div>
        </div>

        <!-- 重點提示框 -->
        <div class="note-box">
          💡 <strong>心法搭配提示</strong>：劍法招式注重「連擊」與「身法加成」，建議優先搭配提升出手速度與暴擊率的內功心法。
        </div>

        <!-- ================= 區塊一：門派劍法招式 ================= -->
        <div class="main-module-block" style="margin-top: 24px;">
          <div class="module-main-header">
            <h3 class="module-title">⚔️ 劍法招式</h3>
          </div>

          <!-- 攻擊招式容器 -->
          <div class="skill-section" style="margin-top: 16px;">
            <div class="section-badge-header">
              <h4 class="section-sub-title">攻擊招式</h4>
            </div>
            <div id="attack-skills-grid" class="item-grid">
              <p style="color: var(--ink-soft); font-size: 12px;">載入攻擊招式中...</p>
            </div>
          </div>

          <!-- 屬性增益招式容器 -->
          <div class="skill-section" style="margin-top: 24px;">
            <div class="section-badge-header">
              <h4 class="section-sub-title">屬性增益招式</h4>
            </div>
            <div id="buff-skills-grid" class="item-grid">
              <p style="color: var(--ink-soft); font-size: 12px;">載入增益招式中...</p>
            </div>
          </div>
        </div>

        <!-- ================= 區塊二：自創招式 ================= -->
        <div class="main-module-block" style="margin-top: 36px; padding-top: 20px; border-top: 2px dashed rgba(109, 83, 118, 0.12);">
          <div class="module-main-header">
            <h3 class="module-title">✨ 自創招式</h3>
          </div>
          <div id="custom-skills-grid" class="item-grid">
            <p style="color: var(--ink-soft); font-size: 12px;">載入自創招式中...</p>
          </div>
        </div>

      </div>
    </article>
  </div>

  <script>
    const SKILLS_DIR = 'skills/';

    // 1. 讀取 skills/manifest.json 清單
    fetch(SKILLS_DIR + 'manifest.json?v=' + new Date().getTime())
      .then(res => {
        if (!res.ok) throw new Error('無法讀取 skills/manifest.json');
        return res.json();
      })
      .then(fileList => {
        // 2. 並行讀取清單中的每一個單獨招式檔案
        const fetchPromises = fileList.map(filename => 
          fetch(SKILLS_DIR + filename + '?v=' + new Date().getTime())
            .then(res => res.json())
        );
        return Promise.all(fetchPromises);
      })
      .then(skills => {
        const attackGrid = document.getElementById('attack-skills-grid');
        const buffGrid = document.getElementById('buff-skills-grid');
        const customGrid = document.getElementById('custom-skills-grid');

        const attackList = [];
        const buffList = [];
        const customList = [];

        // 3. 根據每個檔案中的 category 自動分流渲染
        skills.forEach(skill => {
          const category = skill.category || '';

          if (category.includes('自創')) {
            // 自創招式卡片模板（帶前置招式標籤）
            const tags = (skill.prereq || []).map(t => `<span class="prereq-tag">${t}</span>`).join('');
            customList.push(`
              <div class="item-card">
                <div class="item-card-header">
                  <h4>${skill.name}</h4>
                  <span class="rarity-badge gold">${skill.star || '未評級'}</span>
                </div>
                <div class="prereq-box">
                  <span class="prereq-label">📌 前置招式：</span>
                  <div class="prereq-tags">${tags || '無前置條件'}</div>
                </div>
                <p class="item-desc">${skill.desc || ''}</p>
              </div>
            `);
          } else if (category.includes('攻擊')) {
            // 攻擊招式卡片模板
            attackList.push(`
              <div class="item-card">
                <div class="item-card-header">
                  <h4>${skill.name}</h4>
                  <span class="rarity-badge gold">${skill.star || '未評級'}</span>
                </div>
                <div class="item-meta">
                  <span>獲取地點：${skill.location || '未知'}</span> | <span>屬性：${skill.element || '無'}</span>
                </div>
                <p class="item-desc">${skill.desc || ''}</p>
              </div>
            `);
          } else {
            // 屬性增益招式卡片模板
            buffList.push(`
              <div class="item-card">
                <div class="item-card-header">
                  <h4>${skill.name}</h4>
                  <span class="rarity-badge gold">${skill.star || '未評級'}</span>
                </div>
                <div class="item-meta">
                  <span>獲取地點：${skill.location || '未知'}</span> | <span>屬性：${skill.element || '無'}</span>
                </div>
                <p class="item-desc">${skill.desc || ''}</p>
              </div>
            `);
          }
        });

        // 填入 DOM
        attackGrid.innerHTML = attackList.join('') || '<p style="color: var(--ink-soft); font-size: 12px;">尚無攻擊招式</p>';
        buffGrid.innerHTML = buffList.join('') || '<p style="color: var(--ink-soft); font-size: 12px;">尚無屬性增益招式</p>';
        customGrid.innerHTML = customList.join('') || '<p style="color: var(--ink-soft); font-size: 12px;">尚無自創招式</p>';
      })
      .catch(err => {
        console.error('招式載入失敗:', err);
      });
  </script>
  <script src="../../../js/sidebar.js"></script>
</body>
</html>
