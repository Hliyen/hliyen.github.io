<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間線</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container article-view">
    <!-- 頂部返回導覽（已補上分類與日期標籤） -->
    <nav class="nav-card">
      <a href="../../index.html" class="back-link">
        <span class="arrow">←</span> 返回首頁目錄
      </a>
      <div class="badge-group">
        <span class="badge-item badge-lavender">明日方舟</span>
        <span class="badge-item badge-mint">時間線</span>
      </div>
    </nav>

    <article>
      <div class="game-card">
        <!-- 前文明時間線 -->
        <div class="title-badge-card story" style="margin-top: 0;">
          <h2>前文明時期</h2>
          <div class="badge-group">
            <span class="badge-item badge-lavender">前文明</span>            
          </div>
        </div>
        <div class="timeline">
          <div class="timeline-node">
            <span class="timeline-date">前文明研究項目啟動</span>
            <p class="timeline-content">源石計劃、保存者、天堂支點、深藍之樹等</p>
          </div>
          <div class="timeline-node">
            <span class="timeline-date">DWDB-221E取得研究成果</span>
            <p class="timeline-content">命名為「文明的存續」(Civilight Eterna)</p>
          </div>
           <div class="timeline-node">
            <span class="timeline-date">載有塔位二的航船駛向泰拉</span>
          </div>
          <div class="timeline-node">
            <span class="timeline-date">紀元前12200年(一說前12400年)</span>
            <p class="timeline-content">AMa-10「凱爾希」(Kal'tsit)誕生</p>
          </div>
        </div>
           <!-- 紀元前10000年 -->
          <div class="title-badge-card story" style="margin-top: 0;">
          <h2>紀元前10000年</h2>
          <div class="badge-group">
            <span class="badge-item badge-lavender">紀元前</span>            
          </div>
        </div>
        <div class="timeline">
          <div class="timeline-node">
            <span class="timeline-date">遠逐者終結同類相食的文明</span>
            <p class="timeline-content">泰拉大地上分布著大量的相互採食的捕獵文明，「遠逐者」勸說停止同類相食，被驅逐後意外獲得了「文明的存續」，利用他的力量成功讓大地上的所有部落放棄了同類相食，並征服了「地底的銀色山脈」</p>
          </div>          
        </div>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
