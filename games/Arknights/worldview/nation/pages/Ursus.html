<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>烏薩斯帝國</title>
  <link rel="stylesheet" href="../../../../../css/style.css">
</head>
<body>
  <div class="container article-view">
    <nav class="nav-card">
      <a href="../index.html" class="back-link">
        <span class="arrow">←</span> 返回國家列表
      </a>
      <div class="badge-group">
        <span class="badge-item badge-lavender">世界觀</span>
        <span class="badge-item badge-mint">烏薩斯帝國</span>
      </div>
    </nav>

    <article>
      <div class="game-card">
        <div class="title-badge-card terms" style="margin-top: 0;">
          <h2>🏰 烏薩斯帝國</h2>
          <div class="badge-group">
            <span class="badge-item badge-orange">君主制帝國</span>
          </div>
        </div>

        <!-- 國家基礎資訊面板 -->
        <div class="stat-list" style="margin-bottom: 20px; padding: 12px 14px;">
          <div class="stat-row" style="font-size: 12px; margin-bottom: 6px;">
            <span class="stat-name">🏛️ 首都 / 核心城邦</span>
            <span class="stat-value" style="color: var(--ink); font-weight: 800;">聖駿堡</span>
          </div>
          <div class="stat-row" style="font-size: 12px; margin-bottom: 6px;">
            <span class="stat-name">🪙 官方通行貨幣</span>
            <span class="stat-value" style="color: #a06f52; font-weight: 800;">切爾文 (Victoria Pound)</span>
          </div>
          <div class="stat-row" style="font-size: 12px;">
            <span class="stat-name">👑 主要統治架構</span>
            <span class="stat-value" style="color: var(--ink); font-weight: 800;">沙皇專制/貴族軍閥/特務機構</span>
          </div>
        </div>

        <div class="story-content">
          <h3>概況介紹</h3>
          <p>待新增詳細內容...</p>
        </div>
      </div>
    </article>
  </div>

  <script src="../../../../../js/sidebar.js"></script>
</body>
</html>
