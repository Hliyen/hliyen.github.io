<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明日方舟 - 目錄</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <!-- 頂部返回導覽 -->
    <nav class="nav-card">
      <a href="../../index.html" class="back-link">
        <span class="arrow">←</span> 返回遊戲總覽
      </a>
      <div class="badge-group">
        <span class="badge-item badge-lavender">明日方舟</span>
        <span class="badge-item badge-mint">目錄</span>
      </div>
    </nav>

    <!-- 遊戲卡片容器 -->
    <div class="game-card">
      <h2 class="game-title">明日方舟 目錄</h2>
      <div id="category-container" class="category-grid">
        <p style="color: var(--ink-soft); font-size: 13px;">正在載入各分類資料...</p>
      </div>
    </div>
  </div>

  <script>
    // 定義所有分類及其對應的資料夾與樣式
    const CATEGORY_CONFIG = [
      {
        type: "時間線",
        dir: "timeline/",
        icon: "⏳",
        class: "story"
      },
      {
        type: "劇情",
        dir: "story/",
        icon: "📖",
        class: "story"
      },
      {
        type: "專有名詞",
        dir: "terms/",
        icon: "📚",
        class: "terms"
      }
    ];

    // 載入單一分類資料夾下的所有文章
    async function loadCategory(cat) {
      try {
        const manifestRes = await fetch(`${cat.dir}manifest.json?v=${Date.now()}`);
        if (!manifestRes.ok) return { ...cat, articles: [] };

        const fileList = await manifestRes.json();

        // 讀取該資料夾下的各個 JSON 檔案
        const articlePromises = fileList.map(async name => {
          const fileName = name.endsWith('.json') ? name : `${name}.json`;
          const res = await fetch(`${cat.dir}${fileName}?v=${Date.now()}`);
          if (!res.ok) throw new Error(`讀取失敗: ${cat.dir}${fileName}`);
          return res.json();
        });

        const articles = await Promise.all(articlePromises);
        return { ...cat, articles };
      } catch (err) {
        console.warn(`分類 [${cat.type}] 載入失敗:`, err);
        return { ...cat, articles: [] };
      }
    }

    // 載入所有分類並渲染
    async function renderAllCategories() {
      const container = document.getElementById('category-container');

      try {
        const categories = await Promise.all(CATEGORY_CONFIG.map(loadCategory));

        // 過濾掉完全沒有文章的分類（若希望空分類也顯示可拿掉 filter）
        const validCategories = categories.filter(cat => cat.articles && cat.articles.length > 0);

        if (validCategories.length === 0) {
          container.innerHTML = '<p style="color: var(--ink-soft);">目前尚無文章資料。</p>';
          return;
        }

        container.innerHTML = validCategories.map(cat => {
          const articlesHtml = cat.articles.map(article => {
            const tags = article.tags || (article.date ? [article.date] : []);
            const tagsHtml = tags.map(tag => `<span class="badge">${tag}</span>`).join('');

            return `
              <li class="article-item">
                <a href="${article.url}">${article.title}</a>
                <div class="badge-group">${tagsHtml}</div>
              </li>
            `;
          }).join('');

          return `
            <div class="category-block ${cat.class}">
              <h4>${cat.icon} ${cat.type}</h4>
              <ul class="article-list">
                ${articlesHtml}
              </ul>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('全站目錄渲染失敗:', error);
        container.innerHTML = '<p style="color: var(--coral);">載入資料發生錯誤。</p>';
      }
    }

    renderAllCategories();
  </script>
  <script src="../../js/sidebar.js"></script>
</body>
</html>
