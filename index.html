<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記錄庫</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header style="margin-bottom: 28px;">
      <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 8px;">記錄庫</h1>
      <p style="color: var(--ink-soft); font-size: 13px; margin: 0;">主要是方便我查找和記錄我要的資料。</p>
    </header>

    <!-- 遊戲入口卡片網格 -->
    <main id="game-list" class="category-grid">
      <p style="color: var(--ink-soft); font-size: 13px;">正在載入遊戲清單...</p>
    </main>
  </div>

  <script>
    fetch('data.json?v=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error(`HTTP 錯誤：${response.status}`);
        return response.json();
      })
      .then(games => {
        const container = document.getElementById('game-list');

        if (!Array.isArray(games) || games.length === 0) {
          container.innerHTML = '<p style="color: var(--ink-soft);">目前尚無遊戲紀錄。</p>';
          return;
        }

        container.innerHTML = games.map(game => {
          const tagsHtml = (game.tags || []).map(tag => `<span class="badge">${tag}</span>`).join('');

          return `
            <div class="game-card" style="margin-bottom: 0; display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <h2 class="game-title" style="margin-bottom: 10px;">
                  <a href="${game.url}" style="color: var(--ink); text-decoration: none;">${game.gameName}</a>
                </h2>
                <p style="color: var(--ink-soft); font-size: 13px; line-height: 1.6; margin: 0 0 16px;">
                  ${game.desc || ''}
                </p>
              </div>
              
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px;">
                <div class="badge-group">${tagsHtml}</div>
                <a href="${game.url}" class="back-link" style="padding: 4px 10px; font-size: 12px;">進入專區 →</a>
              </div>
            </div>
          `;
        }).join('');
      })
      .catch(err => {
        console.error('載入失敗:', err);
        document.getElementById('game-list').innerHTML = 
          `<p style="color: var(--coral);">載入失敗，請確認 data.json 路徑與格式。</p>`;
      });
  </script>
</body>
</html>
