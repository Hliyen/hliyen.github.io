<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人紀錄庫 - 總覽</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header style="margin-bottom: 24px;">
      <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 6px;">📖 個人紀錄庫</h1>
      <p style="color: var(--ink-soft); font-size: 13px; margin: 0;">主要是方便我查找和記錄我要的資料。</p>
    </header>

    <!-- 動態大分類卡片容器 -->
    <main id="main-directory">
      <p style="color: var(--ink-soft); font-size: 13px;">正在載入資料...</p>
    </main>
  </div>

  <script>
    fetch('data.json?v=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error(`HTTP 錯誤：${response.status}`);
        return response.json();
      })
      .then(sections => {
        const container = document.getElementById('main-directory');

        if (!Array.isArray(sections) || sections.length === 0) {
          container.innerHTML = '<p style="color: var(--ink-soft);">目前尚無資料。</p>';
          return;
        }

        container.innerHTML = sections.map(sec => {
          const sectionName = sec.sectionName || '專區分類';
          const items = sec.items || [];

          const itemsHtml = items.map(item => {
            const tagsHtml = (item.tags || []).map(tag => `<span class="badge">${tag}</span>`).join('');

            return `
              <a href="${item.url}" class="compact-game-card">
                <div class="compact-game-title">                  
                  <strong>${item.name}</strong>
                </div>
                <div class="badge-group">${tagsHtml}</div>
              </a>
            `;
          }).join('');

          return `
            <div class="game-card">
              <h2 class="game-title">${sectionName}</h2>
              <div class="compact-grid">
                ${itemsHtml || '<p style="color: var(--ink-soft); font-size: 12px;">此分類下尚無項目</p>'}
              </div>
            </div>
          `;
        }).join('');
      })
      .catch(err => {
        console.error('載入失敗:', err);
        document.getElementById('main-directory').innerHTML = 
          `<p style="color: var(--coral);">資料載入失敗，請確認 data.json 格式是否正確。</p>`;
      });
  </script>
</body>
</html>
