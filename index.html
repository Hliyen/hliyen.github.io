<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人紀錄庫 - 總覽</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header style="margin-bottom: 28px;">
      <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 8px;">📖 個人紀錄庫</h1>
      <p style="color: var(--ink-soft); font-size: 13px; margin: 0;">主要是方便我查找和記錄我要的資料。</p>
    </header>

    <!-- 動態渲染大分類卡片容器 -->
    <main id="main-directory">
      <p style="color: var(--ink-soft); font-size: 13px;">正在載入專區資料...</p>
    </main>
  </div>

  <script>
    fetch('data.json?v=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error(`HTTP 錯誤：${response.status}`);
        return response.json();
      })
      .then(sections => {
        const container = document.getElementById('main-directory');

        if (!Array.isArray(sections) || sections.length === 0) {
          container.innerHTML = '<p style="color: var(--ink-soft);">目前尚無專區資料。</p>';
          return;
        }

        // 動態生成大分類卡片（如：遊戲專區），內部再排版各遊戲
        container.innerHTML = sections.map(sec => {
          const sectionName = sec.sectionName || '專區分類';
          const items = sec.items || [];

          const itemsHtml = items.map(item => {
            const tagsHtml = (item.tags || []).map(tag => `<span class="badge">${tag}</span>`).join('');

            return `
              <div class="category-block guide" style="display: flex; flex-direction: column; justify-content: space-between; background: #fffcf8; border-color: rgba(238, 157, 66, 0.25);">
                <div>
                  <h4 style="font-size: 16px; margin-bottom: 8px;">
                    <a href="${item.url}" style="color: var(--ink); text-decoration: none;">${item.name}</a>
                  </h4>
                  <p style="color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0 0 14px;">
                    ${item.desc || ''}
                  </p>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px;">
                  <div class="badge-group">${tagsHtml}</div>
                  <a href="${item.url}" class="back-link" style="padding: 4px 10px; font-size: 11px;">進入專區 →</a>
                </div>
              </div>
            `;
          }).join('');

          return `
            <div class="game-card">
              <h2 class="game-title">${sectionName}</h2>
              <div class="category-grid">
                ${itemsHtml || '<p style="color: var(--ink-soft); font-size: 12px;">此分類下尚無項目</p>'}
              </div>
            </div>
          `;
        }).join('');
      })
      .catch(err => {
        console.error('載入失敗:', err);
        document.getElementById('main-directory').innerHTML = 
          `<p style="color: var(--coral);">資料載入失敗，請確認 data.json 格式是否正確。</p>`;
      });
  </script>
</body>
</html>
